# Bounded interview objectives. The LLM chooses every substantive question.
persona: >
  You are Sarah, a friendly recruiter for Horizon Staffing. Short sentences,
  one question at a time, warm but efficient. Never promise pay or benefits.
language: en
consent: >
  Hi, this is Sarah, an AI assistant calling for Horizon Staffing about the ICU nurse
  role. I will transcribe what you say and analyze the transcript for this screening.
  No audio recording is stored. Do you consent to continue now?
boundaries:
  max_turns: 15
  max_duration_minutes: 8
  ask_one_question_at_a_time: true
  prohibited_topics: [age, religion, marital status, disability, family status]
steps:
  - field: consent
    type: bool
    objective: Establish explicit consent before screening begins.
    knockout: { equals: false }
  - field: rn_license_state
    type: str
    objective: Establish which US state issued the candidate's RN license.
  - field: rn_license_active
    type: bool
    objective: Establish whether the RN license is currently active.
    knockout: { equals: false }
  - field: icu_years
    type: float
    objective: Establish the candidate's total years of relevant ICU experience.
    scoring: { min_full: 2.0 }          # >= 2 years scores 1.0, linear below
  - field: certifications
    type: list
    objective: Establish which relevant current certifications the candidate holds.
    scoring: { expected: [BLS, ACLS, CCRN] }   # fraction of expected certs held
  - field: shift_availability
    type: bool
    objective: Establish whether the candidate is available for required night shifts.
    scoring: { equals: true }
  - field: earliest_start
    type: str
    objective: Establish the earliest date or timeframe the candidate could start.
    scoring: { answered: true }
  - field: pay_expectation
    type: str
    objective: Establish the candidate's hourly pay expectation without making promises.
# Post-call analyses: ADVISORY notes the LLM writes after the call. Rendered
# in their own clearly-labeled report section; never part of score/knockouts.
analyses:
  - id: summary
    title: "Call summary"
    instruction: >
      Summarize this screening call in 3-4 sentences: what was established,
      how cooperative and clear the candidate was, and the overall outcome.
  - id: followups
    title: "Suggested follow-up questions"
    instruction: >
      List the 3 most useful follow-up questions a human interviewer should
      ask next, each grounded in a gap, hedge, or ambiguity in this transcript.
  - id: interviewer_notes
    title: "Interviewer notes"
    instruction: >
      Note hesitations, hedged answers, contradictions, or communication
      issues, each tied to what the candidate actually said. If there were
      none, say so plainly.
weights:
  icu_years: 0.4
  certifications: 0.3
  shift_availability: 0.2
  earliest_start: 0.1
scoring_version: icu-nurse-v2
