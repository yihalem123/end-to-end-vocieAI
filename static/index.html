<!-- Test console. Built across Phases 1-3:
     mic capture (AudioWorklet, 16k PCM16) · live transcript + endpointer (Phase 2)
     playback with flush-on-clear (barge-in) · chat box (Phase 4 text mode) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screener console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1rem; }
    button { font-size: 1.1rem; padding: 0.5rem 1.5rem; }
    #status { color: #666; margin-left: 1rem; }
    #fluxLabel { margin-left: 1rem; font-size: 0.95rem; color: #444; user-select: none; }
    #vad { margin-left: 1rem; } #vad.speech { color: #c00; } #vad.silence { color: #999; }
    #transcript { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin: 1rem 0;
                  min-height: 3.5rem; }
    #partial { color: #999; }
    summary { font-size: 1rem; font-weight: 600; margin: 0.5rem 0 0.25rem; cursor: pointer; }
    #turns { font-variant-numeric: tabular-nums; }
    #convo { max-height: 14rem; overflow-y: auto; margin: 0.5rem 0; }
    .line { padding: 0.15rem 0; } .line.agent { color: #06c; }
    #chatRow { display: flex; gap: 0.5rem; margin: 0.5rem 0; }
    #chatRow input { flex: 1; padding: 0.4rem; }
    #metrics { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    #metrics td, #metrics th { border: 1px solid #ddd; padding: 0.2rem 0.6rem; text-align: right; }
    #metrics th:first-child, #metrics td:first-child { text-align: left; }
    .meta { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Screener console</h1>
  <p>Phase 3: a spoken screening with the stub agent — talk, get answered, and
     interrupt it mid-sentence to test barge-in.</p>
  <button id="btn">Start</button>
  <label id="fluxLabel"><input type="checkbox" id="fluxMode"> Flux end-of-turn</label>
  <span id="status">idle</span><span id="vad"></span>
  <div id="transcript"><span id="finals"></span><span id="partial"></span></div>
  <div id="convo"></div>
  <div id="chatRow">
    <input id="chatText" type="text" placeholder="Text mode: type instead of talking…">
    <button id="chatSend">Send</button>
  </div>
  <details open>
    <summary>Turns (endpoint_delay)</summary>
    <ul id="turns"></ul>
  </details>
  <details open>
    <summary>Metrics (p50/p95, live)</summary>
    <table id="metrics"></table>
  </details>
  <p class="meta">frames sent: <span id="sent">0</span></p>
  <script src="/audio.js"></script>
</body>
</html>
