<!-- Screener console — UI per the "Asandia Demo" Claude Design canvas (option 2a):
     dark Space Grotesk theme, orb + equalizer stage, live transcript sidebar,
     toggleable latency panel. All wire behavior (generation audio, acks,
     session states, chat text mode, flux A/B, per-call report) is unchanged
     and lives in audio.js. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asandia · Voice Screener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0b10; --panel: #0d0e15; --line: rgba(255,255,255,.08);
      --ink: #e8e9f0; --dim: rgba(232,233,240,.55); --faint: rgba(232,233,240,.35);
      --accent: #7c8cf8; --accent-soft: #a3aefb; --amber: #e5a848;
      --green: #6ee787; --red: #e5484d; --idle: #5b6178;
    }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--ink);
           font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden; }
    a { color: var(--accent); } a:hover { color: var(--accent-soft); }
    button { font-family: inherit; cursor: pointer; }

    .app { display: flex; height: 100vh; }

    /* ── left column ─────────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column;
            border-right: 1px solid var(--line); min-width: 0; }
    header { display: flex; align-items: center; justify-content: space-between;
             padding: 20px 28px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .mark { width: 24px; height: 24px; border-radius: 7px;
                   background: linear-gradient(135deg, #7c8cf8, #4c5ae0); }
    .brand span { font: 600 15px 'Space Grotesk'; }
    .hright { display: flex; align-items: center; gap: 14px; }

    .pill-toggle { display: flex; align-items: center; gap: 8px;
                   padding: 6px 8px 6px 12px; border-radius: 100px;
                   border: 1px solid rgba(255,255,255,.12);
                   background: rgba(255,255,255,.04); }
    .pill-toggle:hover { border-color: rgba(255,255,255,.28); }
    .pill-toggle:disabled { opacity: .45; cursor: default; }
    .pill-toggle .lbl { font: 500 12.5px 'Space Grotesk'; color: rgba(232,233,240,.7); }
    .pill-toggle .track { position: relative; width: 32px; height: 18px;
                          border-radius: 100px; background: rgba(255,255,255,.15);
                          transition: background .2s; }
    .pill-toggle .knob { position: absolute; top: 2px; left: 2px; width: 14px;
                         height: 14px; border-radius: 50%; background: #fff;
                         transition: left .2s; }
    .pill-toggle.on .track { background: var(--accent); }
    .pill-toggle.on .knob { left: 16px; }

    .status-pill { display: flex; align-items: center; gap: 8px; padding: 6px 14px;
                   border-radius: 100px; background: rgba(124,140,248,.1);
                   border: 1px solid rgba(124,140,248,.25); }
    .status-pill .dot { width: 8px; height: 8px; border-radius: 50%;
                        background: var(--idle); transition: background .25s; }
    .status-pill span:last-child { font: 500 13px 'Space Grotesk'; color: #c3caff;
                                   max-width: 260px; white-space: nowrap;
                                   overflow: hidden; text-overflow: ellipsis; }

    .stage { flex: 1; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 30px;
             background: radial-gradient(600px 400px at 50% 45%,
                         rgba(124,140,248,.08), transparent 70%); }
    .orbwrap { position: relative; width: 180px; height: 180px; }
    .ring { position: absolute; inset: -22px; border-radius: 50%;
            border: 1px dashed rgba(124,140,248,.3); }
    .orb { position: absolute; inset: 0; border-radius: 50%;
           background: radial-gradient(circle at 34% 28%, #eef0ff 0%, #aab4ff 22%,
                       #7c8cf8 48%, #3743a8 78%, #232a6e 100%);
           box-shadow: 0 0 80px rgba(124,140,248,.4); }
    .live .orb { animation: breathe 4s ease-in-out infinite; }
    .live .ring { animation: breathe 3s ease-in-out infinite; }

    .eq { display: flex; align-items: flex-end; gap: 5px; height: 34px; opacity: .25; }
    .eq span { width: 5px; height: 34px; background: #3d4361; border-radius: 3px;
               transform: scaleY(.25); transform-origin: bottom; }
    .eq.user, .eq.agent { opacity: 1; }
    .eq.user span, .eq.agent span { animation: eq .9s ease-in-out infinite; }
    .eq.agent span { background: var(--accent); }
    .eq span:nth-child(2) { animation-delay: .12s } .eq span:nth-child(3) { animation-delay: .24s }
    .eq span:nth-child(4) { animation-delay: .36s } .eq span:nth-child(5) { animation-delay: .48s }
    .eq span:nth-child(6) { animation-delay: .6s }  .eq span:nth-child(7) { animation-delay: .72s }

    .idleblock, .incall { display: flex; flex-direction: column; align-items: center;
                          gap: 16px; animation: fadeup .4s ease; }
    .idleblock p.copy { font: 400 16px/1.5 'Space Grotesk'; color: var(--dim);
                        text-align: center; max-width: 400px; }
    .idleblock p.hint { font: 400 12.5px 'Space Grotesk'; color: var(--faint); }
    #btn { display: flex; align-items: center; gap: 10px; padding: 15px 30px;
           border: none; border-radius: 10px; background: var(--accent);
           color: #0c0d12; font: 600 16px 'Space Grotesk'; }
    #btn:hover { background: #93a0fa; }
    .incall { flex-direction: row; gap: 12px; }
    #timer { font: 500 15px ui-monospace, Menlo, monospace; color: var(--dim);
             padding: 0 10px; }
    #muteBtn { height: 44px; padding: 0 20px; border-radius: 10px;
               border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
               color: var(--ink); font: 500 14px 'Space Grotesk'; }
    #muteBtn:hover { border-color: rgba(255,255,255,.3); }
    #muteBtn.muted { background: rgba(229,72,77,.25); }
    #endBtn { height: 44px; padding: 0 22px; border-radius: 10px; border: none;
              background: var(--red); color: #fff; font: 600 14px 'Space Grotesk'; }
    #endBtn:hover { background: #f06266; }
    [hidden] { display: none !important; }

    /* ── sidebar ─────────────────────────────────────────────── */
    .side { width: 360px; display: flex; flex-direction: column;
            background: var(--panel); }
    .side h2 { padding: 20px 24px 12px; font: 600 12px 'Space Grotesk';
               color: rgba(232,233,240,.5); letter-spacing: .08em;
               text-transform: uppercase; }
    #convo { flex: 1; overflow: auto; padding: 6px 24px 12px;
             display: flex; flex-direction: column; gap: 12px; }
    #convo .empty { margin-top: 8px; font: 400 13.5px/1.5 'Space Grotesk';
                    color: rgba(232,233,240,.3); }
    .card { padding: 10px 14px; border-radius: 10px;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.06); animation: fadeup .35s ease; }
    .card .who { font: 600 10.5px 'Space Grotesk'; letter-spacing: .08em;
                 text-transform: uppercase; color: rgba(232,233,240,.5);
                 margin-bottom: 3px; display: flex; justify-content: space-between;
                 align-items: baseline; gap: 8px; }
    .card .who .meta { font: 500 10px ui-monospace, Menlo, monospace;
                       color: rgba(232,233,240,.35); text-transform: none;
                       letter-spacing: 0; }
    .card .text { font: 400 13.5px/1.5 'Space Grotesk';
                  color: rgba(232,233,240,.85); overflow-wrap: break-word; }
    .card.agent { background: rgba(124,140,248,.08); }
    .card.agent .who { color: var(--accent-soft); }
    .card.system { border-style: dashed; }
    .card.system .who { color: var(--amber); }
    .card.ghost { opacity: .55; border-style: dashed; }
    .card.report { background: rgba(110,231,135,.07);
                   border-color: rgba(110,231,135,.25); }
    .card.report .who { color: var(--green); }
    .card.report a { color: var(--green); font: 500 13.5px 'Space Grotesk'; }

    .chatrow { display: flex; gap: 8px; padding: 10px 24px 14px; }
    .chatrow input { flex: 1; padding: 9px 12px; border-radius: 10px;
                     border: 1px solid rgba(255,255,255,.1);
                     background: rgba(255,255,255,.04); color: var(--ink);
                     font: 400 13px 'Space Grotesk'; outline: none; }
    .chatrow input::placeholder { color: var(--faint); }
    .chatrow input:focus { border-color: rgba(124,140,248,.5); }
    .chatrow button { padding: 0 16px; border-radius: 10px; border: none;
                      background: rgba(124,140,248,.18); color: var(--accent-soft);
                      font: 600 13px 'Space Grotesk'; }
    .chatrow button:hover { background: rgba(124,140,248,.3); }

    #latencyPanel { border-top: 1px solid var(--line); padding: 16px 24px 20px;
                    display: flex; flex-direction: column; gap: 12px;
                    animation: fadeup .3s ease; }
    #latencyPanel .lathead { display: flex; align-items: baseline;
                             justify-content: space-between; }
    #latencyPanel .lathead .t { font: 600 12px 'Space Grotesk';
                                color: rgba(232,233,240,.5); letter-spacing: .08em;
                                text-transform: uppercase; }
    #e2e { font: 500 12px ui-monospace, Menlo, monospace; color: var(--accent-soft); }
    #latGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .lat { padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.03);
           border: 1px solid rgba(255,255,255,.06); display: flex;
           flex-direction: column; gap: 6px; }
    .lat .row { display: flex; align-items: baseline; justify-content: space-between; }
    .lat .lbl { font: 500 11px 'Space Grotesk'; letter-spacing: .06em;
                text-transform: uppercase; color: var(--dim); }
    .lat .ms { font: 600 14px ui-monospace, Menlo, monospace; }
    .lat .track { height: 3px; border-radius: 2px; background: rgba(255,255,255,.07);
                  overflow: hidden; }
    .lat .fill { height: 100%; width: 0; background: var(--accent);
                 border-radius: 2px; transition: width .4s ease; }
    .lat .fill.hot { background: var(--amber); }

    @keyframes eq { 0%, 100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.045) } }
    @keyframes fadeup { from { opacity: 0; transform: translateY(8px) }
                        to { opacity: 1; transform: translateY(0) } }
  </style>
</head>
<body>
  <div class="app">
    <div class="main">
      <header>
        <div class="brand"><div class="mark"></div><span>Asandia · Voice Screener</span></div>
        <div class="hright">
          <button class="pill-toggle on" id="metricsToggle" type="button">
            <span class="lbl">Metrics</span>
            <span class="track"><span class="knob"></span></span>
          </button>
          <button class="pill-toggle" id="fluxToggle" type="button" title="Deepgram Flux end-of-turn vs the custom endpointer (applies on next session)">
            <span class="lbl">Flux</span>
            <span class="track"><span class="knob"></span></span>
          </button>
          <input type="checkbox" id="fluxMode" hidden>
          <div class="status-pill"><span class="dot" id="statusDot"></span><span id="status">Ready</span></div>
        </div>
      </header>
      <div class="stage" id="stage">
        <div class="orbwrap"><div class="ring"></div><div class="orb"></div></div>
        <div class="eq" id="eqBars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="idleblock" id="idleBlock">
          <p class="copy">End-to-end voice screening demo. Start the session to talk with Sarah live.</p>
          <button id="btn" type="button">Start session</button>
          <p class="hint">Microphone permission will be requested — tap Allow. Use headphones.</p>
        </div>
        <div class="incall" id="incallBlock" hidden>
          <span id="timer">0:00</span>
          <button id="muteBtn" type="button">Mute</button>
          <button id="endBtn" type="button">End session</button>
        </div>
      </div>
    </div>
    <div class="side">
      <h2>Live transcript</h2>
      <div id="convo"><p class="empty" id="convoEmpty">Transcript appears here once the session starts.</p></div>
      <div class="chatrow">
        <input id="chatText" type="text" placeholder="Text mode: type instead of talking…" autocomplete="off">
        <button id="chatSend" type="button">Send</button>
      </div>
      <div id="latencyPanel">
        <div class="lathead"><span class="t">Latency</span><span id="e2e">e2e —</span></div>
        <div id="latGrid"></div>
      </div>
    </div>
  </div>
  <script src="/audio.js"></script>
</body>
</html>
