<!-- Test console. Built across Phases 1-3:
     mic capture (AudioWorklet, 16k PCM16) · live transcript + endpointer (Phase 2)
     playback with flush-on-clear (barge-in) · chat box (Phase 4 text mode) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screener console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1rem; }
    button { font-size: 1.1rem; padding: 0.5rem 1.5rem; }
    #status { color: #666; margin-left: 1rem; }
    #vad { margin-left: 1rem; } #vad.speech { color: #c00; } #vad.silence { color: #999; }
    #transcript { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin: 1rem 0;
                  min-height: 3.5rem; }
    #partial { color: #999; }
    h2 { font-size: 1rem; margin-bottom: 0.25rem; }
    #turns { font-variant-numeric: tabular-nums; }
    .meta { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Screener console</h1>
  <p>Phase 2: speak a sentence, watch it transcribe live, and see how fast the
     endpointer commits your turn after you stop.</p>
  <button id="btn">Start</button><span id="status">idle</span><span id="vad"></span>
  <div id="transcript"><span id="finals"></span><span id="partial"></span></div>
  <h2>Turns (endpoint_delay)</h2>
  <ul id="turns"></ul>
  <p class="meta">frames sent: <span id="sent">0</span></p>
  <script src="/audio.js"></script>
</body>
</html>
