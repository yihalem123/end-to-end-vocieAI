<!-- Test console. Built across Phases 1-3:
     mic capture (AudioWorklet, 16k PCM16) · live transcript · chat box (Phase 4 text mode)
     playback with flush-on-clear (barge-in) · RTT + per-turn latency panel -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Screener console</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    button { font-size: 1.1rem; padding: 0.5rem 1.5rem; }
    dl { display: grid; grid-template-columns: auto auto; gap: 0.25rem 1rem; width: fit-content; }
    dt { color: #666; } dd { margin: 0; font-variant-numeric: tabular-nums; }
    #status { color: #666; margin-left: 1rem; }
    p.note { color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Screener console</h1>
  <p>Phase 1: loopback — your voice goes mic → worklet → WebSocket → server echo → playback worklet.</p>
  <p class="note">Use headphones, or the speaker output feeds back into the mic.</p>
  <button id="toggle">Start</button><span id="status">idle</span>
  <dl>
    <dt>frames sent</dt><dd id="sent">0</dd>
    <dt>frames received</dt><dd id="recv">0</dd>
    <dt>RTT avg (ms, last 50)</dt><dd id="rtt">–</dd>
  </dl>
  <script src="/audio.js"></script>
</body>
</html>
