name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4          # the capture worklet runs as real JS
        with:
          node-version: "22"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest -q                       # no vendor keys: offline suite only
